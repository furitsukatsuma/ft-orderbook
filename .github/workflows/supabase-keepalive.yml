name: Keep Supabase active

on:
  workflow_dispatch:
  schedule:
    # Supabase checks activity over a rolling seven-day window. Run three
    # minimal database reads daily at 12:37 JST (03:37 UTC).
    - cron: "37 3 * * *"

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  database-health-check:
    name: Minimal database activity check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "Required GitHub secrets are missing: SUPABASE_URL and/or SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          if [[ "${SUPABASE_URL}" != https://*.supabase.co ]]; then
            echo "SUPABASE_URL is not a valid hosted Supabase project URL."
            exit 1
          fi

      - name: Send three minimal read-only queries
        shell: bash
        run: |
          set -euo pipefail

          query() {
            local table="$1"
            local column="$2"
            local endpoint="${SUPABASE_URL%/}/rest/v1/${table}?select=${column}&limit=1"
            local status

            status="$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 20 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
              --header "Accept: application/json" \
              "${endpoint}")"

            if [[ "${status}" != "200" ]]; then
              echo "Supabase read failed for ${table} (HTTP ${status})."
              if [[ "${status}" == "540" ]]; then
                echo "The project is paused. Resume it once in Supabase Studio, then rerun this workflow."
              fi
              exit 1
            fi

            echo "${table}: healthy (HTTP ${status})"
          }

          query orders order_id
          query trades trade_id
          query settings key
